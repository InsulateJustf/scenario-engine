[package]
name = "scenario-engine"
version = "0.1.13"
edition = "2021"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
luyaz-scenario = { path = "vendor/luyaz-scenario" }
luyaz-wifi = { path = "vendor/luyaz-wifi" }
luyaz-policy = { path = "vendor/luyaz-policy", features = ["serde"] }
serde_json = "1"

[workspace]
resolver = "2"
members = [".", "vendor/luyaz-policy", "vendor/luyaz-scenario", "vendor/luyaz-wifi"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
